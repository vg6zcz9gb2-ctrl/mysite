<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Neutral Metadata -->
    <meta property="og:title" content="Shared Media Content">
    <meta property="og:description" content="Tap to view shared content.">
    <meta property="og:type" content="website">

    <title>Media Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Retro CRT Scanline Overlay -->
    <div class="crt-overlay"></div>

    <!-- Screen 1: Generic Media Access Card -->
    <div id="warning-screen" class="screen">
        <div class="redirect-card">
            <div class="app-icon">
                <!-- Generic Play / Media Icon -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            <h2>View Shared Content?</h2>
            <p>You have received a shared media file. Tap below to proceed.</p>
            <div class="button-group">
                <button id="launch-btn" class="btn-primary">View Content</button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Data Terminal -->
    <div id="data-screen" class="screen hidden">
        <div class="rec-indicator">● REC</div>
        <div class="terminal-container">
            <div class="terminal-header">*** UNUSUAL ACTIVITY DETECTED ***</div>
            <pre id="typewriter-text"></pre><span class="cursor">_</span>
        </div>
    </div>

    <!-- Screen 3: The Jump Scare -->
    <div id="scare-screen" class="screen hidden">
        <img src="IMG_4928.jpg" alt="BOO!" id="scary-img">
    </div>

    <!-- Horror Audio File -->
    <audio id="scream-audio" src="freesound_community-jumpscare-68730.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
</body>
</html>
